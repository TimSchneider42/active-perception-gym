[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ap_gym"
dynamic = ["version"]
description = "Active Perception Gym: extension of Gymnasium for active perception tasks."
authors = [
    { name = "Tim Schneider", email = "tim@robot-learning.de" }
]
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "gymnasium>=1.1.0",
    "scipy",
    "numpy",
    "datasets",
    "shapely",
]

[project.urls]
homepage = "https://github.com/TimSchneider42/active-perception-gym"

[project.optional-dependencies]
examples = ["matplotlib"]

[tool.setuptools.packages.find]
include = ["ap_gym*"]

[project.scripts]
ap-gym-create-env-vid = "ap_gym.tools.create_env_vid:main"

[tool.setuptools_scm]
# Version is inferred from the latest "v*" git tag; between tags this yields
# development versions like 0.1.1.dev3+g1a2b3c4 (tagged builds are plain X.Y.Z).
version_file = "ap_gym/_version.py"
fallback_version = "0.0.0"
version_scheme = "guess-next-dev"
